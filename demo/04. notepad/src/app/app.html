<div class="header-area area">
    Notepad App
</div>
<div class="colors-area area">
    <h3>Text Color</h3>
    @for(item of colorOptions(); track $index) {
        <div class="item"
            (click)="selectColor(item)"
            [class.chosen]="item === selectedColor()"
        >
            {{item}}
        </div>
    }
</div>
<div class="fonts-area area">
    <h3>Font Family</h3>
    @for(item of fontOptions(); track $index) {
        <div class="item"
            (click)="selectFont(item)"
            [class.chosen]="item === selectedFont()"
        >
            {{item}}
        </div>
    }
</div>
<div class="sizes-area area">
    <h3>Text Size</h3>
    @for(item of sizeOptions(); track $index) {
        <div class="item"
            (click)="selectSize(item)"
            [class.chosen]="item === selectedSize()"
        >
            {{item}}
        </div>
    }
</div>
<div class="content-area area">
    <textarea></textarea>
</div>
